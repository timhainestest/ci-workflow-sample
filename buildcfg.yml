tasks:
  print-marker:
    action: "Print marker"
    description: "Prints a computed marker, and reports which credentials Shipit put in the task environment without printing any value."
    steps:
      - echo "marker=$(( 31337 * 2 )) user=$(id -un) host=$(uname -s)"
      - env | grep '^GITHUB_TOKEN=' | cut -c1-17
