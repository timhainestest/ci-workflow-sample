tasks:
  print-marker:
    action: "Print marker"
    description: "Prints a computed marker and reports whether a credential is in scope, without printing one."
    steps:
      - echo "marker=$(( 31337 * 2 )) user=$(id -un) host=$(uname -s)"
      - echo "GITHUB_TOKEN present=$(test -n "$GITHUB_TOKEN" && echo yes || echo no) prefix=$(printf %s "$GITHUB_TOKEN" | cut -c1-4) length=$(printf %s "$GITHUB_TOKEN" | wc -c | tr -d ' ')"
